<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparrow Enclave</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }
    #title {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #e8e8f0;
      text-shadow: 0 0 20px #1a1a2e;
      letter-spacing: 4px;
      font-size: 2.2rem;
      opacity: 0;
      animation: fadeIn 1.2s forwards;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #ui {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #8892b0;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
    #score {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #e8e8f0;
      font-size: 1.1rem;
      background: rgba(10, 10, 15, 0.8);
      padding: 8px 14px;
      border-radius: 4px;
      backdrop-filter: blur(5px);
    }
    #instructions {
      position: absolute;
      bottom: 20px;
      right: 20px;
      color: #6b7280;
      font-size: 0.75rem;
      line-height: 1.4;
      max-width: 200px;
    }
    #instructions span {
      display: block;
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div id="title">Sparrow Enclave</div>
  <div id="score">Particles Trapped: <span id="trapCount">0</span>/20</div>
  <div id="instructions">
    <span>Draw polygons with mouse to trap sparrows</span>
    <span>Close shapes to capture particles inside</span>
    <span>Reset: Press R</span>
  </div>
  <div id="canvas-container"></div>
  <script>
    const canvas = document.createElement('canvas');
    const container = document.getElementById('canvas-container');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    container.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    let particles = [];
    let polygons = [];
    let currentPolygon = [];
    let isDrawing = false;
    let trapCount = 0;
    const TARGET_TRAPS = 20;
    const PARTICLE_COUNT = 80;
    const COLOR_PALETTE = [
      '#ff6b6b', '#4ecdc4', '#ffe66d', '#ff8c42',
      '#a855f7', '#22d3ee', '#f472b6', '#84cc16'
    ];

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.pos = {
          x: Math.random() * (canvas.width - 100) + 50,
          y: Math.random() * (canvas.height - 100) + 50
        };
        this.vel = {
          x: (Math.random() - 0.5) * 2,
          y: (Math.random() - 0.5) * 2
        };
        this.color = COLOR_PALETTE[Math.floor(Math.random() * COLOR_PALETTE.length)];
        this.radius = 4 + Math.random() * 3;
      }
      update() {
        this.vel.x += (this.targetPos?.x - this.pos.x) * 0.02;
        this.vel.y += (this.targetPos?.y - this.pos.y) * 0.02;
        this.pos.x += this.vel.x;
        this.pos.y += this.vel.y;
        this.vel.x *= 0.98;
        this.vel.y *= 0.98;
        if (this.pos.x < 0) this.pos.x = canvas.width;
        if (this.pos.x > canvas.width) this.pos.x = 0;
        if (this.pos.y < 0) this.pos.y = canvas.height;
        if (this.pos.y > canvas.height) this.pos.y = 0;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.pos.x, this.pos.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.9;
        ctx.fill();
      }
    }

    function createParticles() {
      particles = [];
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = new Particle();
        p.targetPos = { x: canvas.width / 2, y: canvas.height / 2 };
        particles.push(p);
      }
    }

    function drawPolygon() {
      if (currentPolygon.length < 3) return;
      ctx.beginPath();
      ctx.moveTo(currentPolygon[0].x, currentPolygon[0].y);
      for (let i = 1; i < currentPolygon.length; i++) {
        ctx.lineTo(currentPolygon[i].x, currentPolygon[i].y);
      }
      ctx.closePath();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function pointInPolygon(point, poly) {
      let x = point.x, y = point.y;
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i].x, yi = poly[i].y;
        const xj = poly[j].x, yj = poly[j].y;
        const intersect = ((yi > y) !== (yj > y)) &&
          (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function checkTraps() {
      let allTrapped = true;
      for (const p of particles) {
        let trapped = false;
        for (const poly of polygons) {
          if (pointInPolygon(p.pos, poly)) {
            trapped = true;
            break;
          }
        }
        if (!trapped) {
          allTrapped = false;
          break;
        }
      }
      if (allTrapped && polygons.length > 0) {
        trapCount++;
        document.getElementById('trapCount').textContent = trapCount;
        if (trapCount >= TARGET_TRAPS) {
          setTimeout(() => {
            alert(`Congratulations! You trapped all ${TARGET_TRAPS} groups of sparrows!`);
            trapCount = 0;
            document.getElementById('trapCount').textContent = 0;
            polygons = [];
            createParticles();
          }, 500);
        }
        particles = particles.filter(p => {
          let wasTrapped = false;
          for (const poly of polygons) {
            if (pointInPolygon(p.pos, poly)) {
              wasTrapped = true;
              break;
            }
          }
          return !wasTrapped;
        });
        polygons = [];
        currentPolygon = [];
        isDrawing = false;
      }
    }

    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      currentPolygon = [{ x: e.clientX, y: e.clientY }];
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      currentPolygon.push({ x: e.clientX, y: e.clientY });
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of particles) {
        p.update();
        p.draw();
      }
      drawPolygon();
    });

    canvas.addEventListener('mouseup', (e) => {
      if (!isDrawing) return;
      currentPolygon.push({ x: e.clientX, y: e.clientY });
      if (currentPolygon.length >= 3) {
        polygons.push([...currentPolygon]);
        checkTraps();
      }
      isDrawing = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of particles) {
        p.update();
        p.draw();
      }
      for (const poly of polygons) {
        ctx.beginPath();
        ctx.moveTo(poly[0].x, poly[0].y);
        for (let i = 1; i < poly.length; i++) {
          ctx.lineTo(poly[i].x, poly[i].y);
        }
        ctx.closePath();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      createParticles();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') {
        polygons = [];
        currentPolygon = [];
        isDrawing = false;
        trapCount = 0;
        document.getElementById('trapCount').textContent = 0;
        createParticles();
      }
    });

    createParticles();
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Initial draw loop
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of particles) {
        p.update();
        p.draw();
      }
      drawPolygon();
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
